stages: [lint, build, test, scan, deploy-staging, deploy-prod]

# One pipeline per MR, or per branch push when no MR is open (avoids duplicates).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

include:
  - local: ci/jobs.yml
  - local: ci/scan.yml
  - template: Jobs/SAST.gitlab-ci.yml        # GitLab-shipped template
  # Practice remote:/project: includes later, e.g.
  # - project: group/ci-templates
  #   ref: main
  #   file: /shared.yml

lint:
  stage: lint
  extends: .python
  tags: [docker]
  script:
    - black --check src
    - flake8 src/app src/run.py
  rules:
    - changes: [src/**/*, .flake8, .gitlab-ci.yml]

build:
  stage: build
  extends: .docker
  needs: []
  script:
    # --provenance=false: the containerd image store attaches attestation manifests the GitLab registry rejects ("blob unknown")
    - docker build --provenance=false --build-arg APP_VERSION=$CI_COMMIT_SHORT_SHA --cache-from $CI_REGISTRY_IMAGE:latest -t $IMAGE .
    - docker push $IMAGE
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag $IMAGE $CI_REGISTRY_IMAGE:latest && docker push $CI_REGISTRY_IMAGE:latest
      fi

test:
  stage: test
  extends: .python
  tags: [docker]
  needs: []
  script:
    - cd src && pytest -v --junitxml=../report.xml --cov=app --cov-report=xml:../coverage.xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

deploy-staging:
  stage: deploy-staging
  extends: .deploy
  needs: [build, test, trivy-image]
  variables:
    DEPLOY_HOST: $STAGING_HOST
    APP_PORT: "8080"
  environment:
    name: staging
    url: http://$STAGING_HOST:8080
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-prod:
  stage: deploy-prod
  extends: .deploy
  needs: [deploy-staging]
  variables:
    DEPLOY_HOST: $STAGING_HOST     # single deploy VM: prod on a different port
    APP_PORT: "80"
  environment:
    name: production
    url: http://$STAGING_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
