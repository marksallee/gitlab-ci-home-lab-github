name: CI

# Mirror of the GitLab pipeline's build, test and scan stages for GitHub.
# The full pipeline (registry, runner, staging and production deploys) runs on self-hosted GitLab.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements-dev.txt
      - run: pip install -r src/requirements-dev.txt
      - run: black --check src
      - run: flake8 src/app src/run.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements-dev.txt
      - run: pip install -r src/requirements-dev.txt
      - name: Unit tests with coverage
        working-directory: src
        run: pytest -v --junitxml=../report.xml --cov=app --cov-report=xml:../coverage.xml --cov-report=term
      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"### Test coverage: {rate:.0%}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report only, like the allow_failure scanners in GitLab

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image (no push) for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ci-image:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ci-image:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Log in to GHCR (main and tags only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (main and tags only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
