# Local template: hidden jobs (dot-prefixed) reused via extends:
.python:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files: [src/requirements-dev.txt]   # cache invalidates only when deps change
    paths: [.cache/pip]
  before_script:
    - pip install -r src/requirements-dev.txt

.docker:
  image: docker:27
  tags: [docker]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.deploy:
  image: alpine:3.20
  tags: [docker]
  before_script:
    - apk add --no-cache openssh-client
    - install -m 600 "$SSH_PRIVATE_KEY" ~/id_deploy
  script:
    - |
      ssh -i ~/id_deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "
        echo '$CI_JOB_TOKEN' | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY &&
        docker pull $IMAGE &&
        (docker rm -f app-$CI_ENVIRONMENT_SLUG || true) &&
        docker run -d --name app-$CI_ENVIRONMENT_SLUG --restart unless-stopped -p $APP_PORT:8000 $IMAGE"
